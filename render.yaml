services:
  - type: web
    name: bbb-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt -r requirements-api.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./book_club_archivist.db
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: AUTH_REQUIRED
        value: false
