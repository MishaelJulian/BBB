services:
  - type: web
    name: bbb-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt -r requirements-api.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: AUTH_REQUIRED
        value: true
      - key: AUTH_INTERNAL_URL
        sync: false # the bbb-auth service URL, e.g. https://bbb-auth.onrender.com
      - key: ORIGIN_SECRET
        sync: false # same value as ORIGIN_SECRET on Vercel (D35)

  - type: web
    name: bbb-auth
    runtime: node
    plan: free
    region: singapore
    rootDir: auth
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BETTER_AUTH_SECRET
        sync: false # 32+ random chars, set in the Render dashboard only
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: BETTER_AUTH_URL
        value: https://bbb-library.vercel.app
      - key: TRUSTED_ORIGINS
        value: https://bbb-library.vercel.app
      - key: AUTH_DB_PATH
        value: ./data/auth.db
