version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bbb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbb_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-bbb_library}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbb_admin} -d ${POSTGRES_DB:-bbb_library}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bbb_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bbb_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bbb_admin}:${POSTGRES_PASSWORD:-bbb_secret_password}@postgres:5432/${POSTGRES_DB:-bbb_library}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - bbb_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bbb_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - bbb_network

networks:
  bbb_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
